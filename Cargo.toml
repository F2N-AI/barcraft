[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/barcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/OWNER/barcraft"

[workspace.dependencies]
barcraft-core = { path = "crates/core" }
barcraft-win32 = { path = "crates/win32" }

chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
raw-window-handle = "0.6"

eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = { version = "0.37", default-features = false }

windows = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
